<style>body{display:grid;place-items:center;min-height:100vh;padding:20px 16px;margin:0}.box{width:100%;max-width:400px;text-align:center}.box img{width:116px;height:116px;border-radius:22.5%;box-shadow:0 12px 34px rgba(15,23,42,.3)}.box h1{margin:16px 0 4px;font-size:28px;letter-spacing:-.02em}.box p{margin:0 0 22px;color:var(--mut)}.box .btn{width:100%;margin-top:10px;padding:16px;font-size:17px;border-radius:16px}.box small{display:block;margin-top:18px;color:var(--mut)}</style>

<main class="box">

<script>
/* Installed copy opened from the home screen: go straight to the app. */
if(window.MyPWA&&MyPWA.isInstalled()) location.replace("/wayof-health/app/");
if('serviceWorker' in navigator) navigator.serviceWorker.register('/wayof-health/sw.js',{scope:'/wayof-health/'}).catch(function(){});
