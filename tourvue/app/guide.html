<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050d"><title>TourVue Guide Camera</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="styles.css?v=11"></head><body class="camera-body"><main class="guide-camera-app"><video id="guideVideo" class="guide-camera-video" muted playsinline autoplay></video><div class="camera-fallback" id="cameraFallback"><img src="assets/icon.svg" alt="TourVue"><b>TourVue</b><span>Tap the live button to open your phone camera through the browser.</span></div><header class="camera-top"><a class="icon-btn" href="browse.html" aria-label="Back">‹</a><div class="camera-brand"><img src="assets/icon.svg" alt=""><strong>TourVue</strong><span id="guideStatus">OFFLINE</span></div><a class="icon-btn" href="account.html" aria-label="Account">◎</a></header><section class="camera-live-pill"><span>●</span><b id="cameraLiveText">READY</b><em id="viewerNow">0</em></section><nav class="camera-left-rail" aria-label="Guide camera controls"><button class="icon-btn" id="startStream" aria-label="Go live" title="Go live">●</button><button class="icon-btn" id="stopStream" aria-label="Stop live" title="Stop">■</button><button class="icon-btn" id="flipCamera" aria-label="Flip camera" title="Flip camera">⇄</button><button class="icon-btn" id="useGps" aria-label="Update GPS" title="GPS">⌖</button><button class="icon-btn" id="toggleGuidePanel" aria-label="Room panel" title="Room panel">☰</button></nav><nav class="camera-right-rail" aria-label="Quick links"><a class="icon-btn" href="live.html" aria-label="Preview room" title="Preview room">◉</a><a class="icon-btn" href="wallet.html" aria-label="Wallet" title="Wallet">◌</a><a class="icon-btn" href="browse.html" aria-label="Browse" title="Browse">⌕</a></nav><section class="camera-health"><div><small>FPS</small><b id="fpsNow">3
